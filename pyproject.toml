[project]
name = 'graph-aml-detector'
version = '0.1.0'
description = 'Anti-money laundering detection on Bitcoin transactions using Graph Neural Networks and an agentic investigation layer'
readme = 'README.md'
requires-python = '>=3.10'
authors = [
    { name = 'Luis Renteria' },
]

dependencies = [
    'torch>=2.2',
    'torch-geometric>=2.5',
    'networkx>=3.2',
    'pandas>=2.1',
    'numpy>=1.26',
    'scikit-learn>=1.4',
    'xgboost>=2.0',
    'langgraph>=0.2',
    'fastapi>=0.110',
    'pydantic>=2.6',
    'uvicorn>=0.29',
    'streamlit>=1.33',
    'plotly>=5.20',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0',
    'ruff>=0.3',
    'ipykernel>=6.29',
]

[tool.ruff]
line-length = 100
target-version = 'py310'

[tool.ruff.lint]
select = ['E', 'F', 'I']

[tool.ruff.format]
quote-style = 'single'
