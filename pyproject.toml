[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'graph-aml-detector'
version = '0.1.0'
description = 'Graph neural network for anti-money-laundering detection with an agentic investigation layer'
readme = 'README.md'
requires-python = '>=3.11'
license = {text = 'MIT'}
authors = [{name = 'Luis Renteria'}]
dependencies = [
    # torch, torch-geometric and the compiled extensions are installed
    # separately against CUDA 13.0 (see README). Left out here on purpose
    # so pip does not pull the wrong CUDA build.
    'networkx',
    'pandas',
    'numpy',
    'scikit-learn',
    'xgboost',
    'langgraph',
    'langchain-core',
    'langchain-ollama',
    'fastapi',
    'uvicorn',
    'pydantic',
    'pydantic-settings',
    'streamlit',
    'plotly',
    'pyvis',
    'langfuse',
    'python-dotenv',
    'tqdm',
]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-cov',
    'ruff',
    'mypy',
    'ipykernel',
    'jupyterlab',
    'matplotlib',
]

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q'